services:
  db:
    image: postgres:15
    container_name: fixit-odoo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_password_segura
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
  odoo:
    image: odoo:17.0
    container_name: fixit-odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo_password_segura
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    restart: unless-stopped
volumes:
  odoo-db-data:
  odoo-web-data: